spring:
  application:
    name: spring-board
  config:
    import: ./config.yml
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  datasource:
    url: ${db.url}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    encoding:
      charset: utf-8
      force: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 이메일 발송 (Gmail STMP)
# SMTP = 이메일 보내기 imap = 메일 받기(=기기간의 동기화 가능) pop3 = 메일 받기 (=기기간의 동기화 안됨)
  mail:
    host: smtp.gmail.com
    password: $(mail.password)
    username: $(mail.userword)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis:
  mapper-locations: classpath:mappers/**/*.xml

file:
  upload:
    path: ${upload.profile-path}
    board-path: ${upload.board-path}

jwt:
  secret: ${jwt.config.secret}
  access-exprity: 1800000
  refresh-expriry: 1209600000
